{% extends "base.html" %}

{% block title %}Edit Subject{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1>✏️ Edit Subject</h1>
        <p class="text-secondary">Update subject details</p>
    </div>
</div>

<form method="post" action="/admin/subjects/{{ subject.id }}/edit">
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">📝 Subject Information</h5>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="name" class="form-label">Subject Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" 
                       value="{{ subject.name }}" required>
                <small class="form-text text-muted">Enter the name of the subject (e.g., Mathematics, Physics)</small>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ subject.description or '' }}</textarea>
                <small class="form-text text-muted">Optional description for this subject</small>
            </div>
            
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="true" 
                       {% if subject.is_active %}checked{% endif %}>
                <label class="form-check-label" for="is_active">
                    Active (Subject will be available for selection)
                </label>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-lg">✅ Update Subject</button>
        <a href="/admin/subjects" class="btn btn-secondary btn-lg">❌ Cancel</a>
    </div>
</form>
{% endblock %}
