{% extends "base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1>✏️ Edit User</h1>
        <p class="text-secondary">Update user information</p>
    </div>
</div>

<form method="post" action="/admin/users/{{ edit_user.id }}/edit">
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">📝 User Information</h5>
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="username" name="username" value="{{ edit_user.username }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ edit_user.email or '' }}">
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
                <select class="form-control" id="role" name="role" required>
                    <option value="student" {% if edit_user.role.value == "student" %}selected{% endif %}>Student</option>
                    <option value="teacher" {% if edit_user.role.value == "teacher" %}selected{% endif %}>Teacher</option>
                    <option value="admin" {% if edit_user.role.value == "admin" %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="true" {% if edit_user.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">
                        Active
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-lg">✅ Update User</button>
        <a href="/admin/users" class="btn btn-secondary btn-lg">❌ Cancel</a>
    </div>
</form>
{% endblock %}
