{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1>🔒 Change Password</h1>
        <p class="text-secondary">Update your account password</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">🔐 Password Change</h3>
            </div>
            <div class="card-body">
                <form method="post" action="/student/change-password">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">Current Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                        <small class="text-muted">Password must be at least 6 characters long</small>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm New Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">💾 Change Password</button>
                        <a href="/student/profile" class="btn btn-secondary">← Back to Profile</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
